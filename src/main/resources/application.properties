spring.application.name=ArtConnect

# Secrets come from environment variables, or from a local .env file (see .env.example)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:8081/artconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches
spring.flyway.enabled=true
# db/sample loads demo users, artworks, bids, reviews and exhibitions into a fresh database.
# In production set FLYWAY_LOCATIONS=classpath:db/migration to leave it out.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/sample}
# Lets a database that already has the sample data keep starting after it is switched off
spring.flyway.ignore-migration-patterns=*:missing,*:future
# A database populated by hand from database/artconnect.sql (which covers versions up to 2.2)
# is adopted as-is; later migrations still run. Has no effect on an empty database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2.2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Payments: "mock" = demo mode, no real money (default, for local development)
#           "razorpay" = real payments; needs the Razorpay keys below (test keys start with rzp_test_)
app.payments.provider=${PAYMENT_PROVIDER:mock}
app.payments.currency=INR
# How long a buyer has to pay before a reserved artwork goes back on sale
app.payments.hold-minutes=30
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Invoices are emailed to the address entered at checkout.
#   EMAIL_PROVIDER: "outbox" = demo, saves each email as an .html file in OUTBOX_DIR (default)
#                   "smtp"   = real email via the SMTP_* settings (Gmail app password, Brevo, Mailtrap...)
app.notifications.email.provider=${EMAIL_PROVIDER:outbox}
app.notifications.outbox-dir=${OUTBOX_DIR:outbox}
app.notifications.email.from=${EMAIL_FROM:ArtConnect <no-reply@artconnect.local>}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
# Address of the website, used for "view invoice" links in emails
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.timezone=Asia/Kolkata

# Browser origins allowed to call the API directly (comma-separated; patterns like http://localhost:[*] allowed)
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:[*],http://127.0.0.1:[*]}
app.auth.token-validity-days=7

# The React build is served from classpath:/static by WebConfig (with SPA fallback)
spring.web.resources.add-mappings=false

# Port the API listens on (the React dev server proxies to it; see frontend/.env.example)
server.port=${PORT:8083}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
